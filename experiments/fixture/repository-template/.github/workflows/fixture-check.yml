name: Build 001 fixture check

on:
  push:
    branches:
      - 'wk-b001-*'

permissions:
  contents: read

jobs:
  deterministic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Apply fixture check regime
        shell: bash
        env:
          WK_BUILD001_CHECK_MODE: ${{ secrets.WK_BUILD001_CHECK_MODE }}
        run: |
          case "$WK_BUILD001_CHECK_MODE" in
            ""|success) exit 0 ;;
            failure) exit 1 ;;
            *) echo "unsupported hidden fixture check mode" >&2; exit 2 ;;
          esac

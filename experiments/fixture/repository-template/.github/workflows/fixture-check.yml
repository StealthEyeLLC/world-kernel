name: Build 001 fixture check

on:
  push:
    branches:
      - 'wk-b001-*'

permissions:
  contents: read

jobs:
  deterministic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Apply fixture check regime
        shell: bash
        run: |
          mode="$(tr -d '\r\n' < fixture/check-mode.txt)"
          case "$mode" in
            success) exit 0 ;;
            failure) exit 1 ;;
            *) echo "unsupported fixture check mode: $mode" >&2; exit 2 ;;
          esac

